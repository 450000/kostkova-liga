*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a12;--bg2:#12121e;--bg3:#1a1a2a;--bg4:#222235;

  --blue:#3b82f6;--green:#22c55e;--red:#ef4444;--purple:#7c3aed;

html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .18s;display:inline-flex;align-items:center;gap:5px}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover:not(:disabled){background:var(--accent2);color:#fff}
.btn-secondary{background:var(--bg4);color:var(--text);border:1px solid var(---border)}
.btn-secondary:hover:not(:disabled){background:var(--bg3)}
.btn-danger{background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b}
.btn-danger:hover:not(:disabled){background:#991b1b}
.btn-sm;padding:3px 9px;font-size:.76rem}
.hidden{display:none!important}
